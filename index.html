<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - COTI Informática</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            font-weight: 600;
            color: #0d6efd;
        }

        .btn-login {
            background-color: #0d6efd;
            border: none;
        }

        .btn-login:hover {
            background-color: #0a58ca;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="login-title">COTI Informática</h3>
                <p class="text-muted mb-0">Acesso ao sistema</p>
            </div>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        placeholder="usuario@cotiinformatica.com.br"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="senha" 
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-login">
                        Entrar
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">
                    © 2026 COTI Informática
                </small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
